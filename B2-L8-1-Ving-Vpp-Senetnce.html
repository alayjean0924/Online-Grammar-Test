---
title: "龍騰B2 L8-1：句首分詞構句"
layout: null
---
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文法測驗：句首分詞構句</title>
    <style>
        :root {
            --primary: #4a90e2; --primary-dark: #357abd;
            --success: #2ecc71; --danger: #e74c3c;
            --bg: linear-gradient(135deg, #e0f2e9 0%, #fae8eb 100%);
            --text: #2c3e50; --gold: #f39c12;
        }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); margin: 0; min-height: 100vh; display: flex; justify-content: center; padding: 20px 0; color: var(--text); }
        #app { width: 95%; max-width: 750px; text-align: center; }
        .screen { display: none; animation: fadeIn 0.3s ease; width: 100%; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        
        .home-card { background: white; padding: 40px 25px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .home-card h1 { font-size: 2rem; color: var(--primary); margin: 0 0 10px; font-weight: 800; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(255,255,255,0.9); padding: 15px 25px; border-radius: 20px; }
        .btn-back-home { background: #95a5a6; color: white; border: none; padding: 8px 18px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-back-home:hover { filter: brightness(0.9); }
        
        .card-container { perspective: 1500px; margin-bottom: 20px; }
        .card-inner { position: relative; width: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; display: flex; min-height: 300px; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face { width: 100%; padding: 30px; background: white; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
        .card-back { position: absolute; top: 0; left: 0; height: 100%; width: 100%; background: #fffdf5; border: 3px solid var(--gold); transform: rotateY(180deg); z-index: 1; }
        
        .hint-text { font-size: 0.9rem; color: #95a5a6; margin-bottom: 15px; }
        .sent-box { font-size: 1.3rem; line-height: 1.6; color: #34495e; text-align: left; }
        .back-zh-box { font-size: 1.3rem; font-weight: bold; line-height: 1.6; color: var(--primary-dark); }
        
        .blank-text { 
            color: var(--primary); 
            font-weight: 900; 
            border-bottom: 3px solid var(--primary);
            padding: 0 10px;
            margin: 0 4px;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .opt-btn { background: white; border: 2px solid #eef2f7; padding: 20px; border-radius: 15px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; font-weight: 600; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .opt-btn:hover { border-color: var(--primary); background: #f0f7ff; }
        .opt-btn.selected { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.02); box-shadow: 0 6px 15px rgba(74, 144, 226, 0.3); }
        
        .nav-bar { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; }
        .btn-nav { flex: 1; padding: 18px; border-radius: 20px; border: none; background: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn-nav:hover { background: #f8f9fa; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-submit { background: var(--gold); color: white; }
        .btn-submit:hover { background: #e67e22; }

        .btn-main { background: var(--primary); color: white; border: none; padding: 18px 50px; font-size: 1.3rem; border-radius: 50px; cursor: pointer; width: 85%; max-width: 320px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }

        .result-list { text-align: left; background: #f8f9fa; border-radius: 20px; padding: 20px; margin-top: 25px; max-height: 500px; overflow-y: auto; }
        .result-item { border-bottom: 2px solid #ddd; padding: 20px 0; font-size: 1.1rem; }
        .result-item:last-child { border-bottom: none; }
        .text-green { color: var(--success); font-weight: bold; }
        .text-red { color: var(--danger); font-weight: bold; }
        .review-sent { font-size: 1.2rem; margin-bottom: 10px; color: #34495e; line-height: 1.5; }
    </style>
</head>
<body>

<div id="app">
    <div id="quiz-screen" class="screen active">
        <div class="top-nav" style="flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn-back-home" style="background: var(--primary);" onclick="window.location.href='{{ "/" | relative_url }}'">⌂ 返回文法複習主頁面</button>
                <button class="btn-back-home" onclick="location.reload()">↺ 重新開始</button>
            </div>
            <div style="font-weight: 800; color: var(--primary); white-space: nowrap;">B2 L8-1 | 第 <span id="progress-label"></span> 題</div>
        </div>
        
        <div class="card-container" onclick="flipCard()">
            <div class="card-inner" id="main-card-inner">
                <div class="card-face card-front">
                    <div class="hint-text">💡 點擊卡片翻面看中文解釋</div>
                    <div id="quiz-stem" class="sent-box"></div>
                </div>
                <div class="card-face card-back">
                    <div class="hint-text" style="color: #d35400;">💡 點擊卡片翻回題目</div>
                    <div id="back-zh" class="back-zh-box"></div>
                </div>
            </div>
        </div>
        
        <div id="quiz-options" class="options-grid"></div>

        <div class="nav-bar">
            <button id="btn-prev" class="btn-nav" onclick="moveStep(-1)">← 上一題</button>
            <button id="btn-next" class="btn-nav" onclick="moveStep(1)">下一題 →</button>
            <button id="btn-submit" class="btn-nav btn-submit" style="display:none;" onclick="submitQuiz()">送出看成績 📝</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div class="home-card">
            <h2 id="final-title" style="margin-bottom:20px;">🏆 測驗完成！</h2>
            <div id="final-score" style="font-size: 3.5rem; color: var(--primary); font-weight: 800; margin: 10px 0;"></div>
            <p id="final-stats" style="font-size: 1.2rem; color: #7f8c8d; margin-bottom: 20px;"></p>
            <div id="report-list-view" class="result-list"></div>
            
            <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 25px;">
                <button class="btn-main" onclick="location.reload()" style="margin: 0;">↺ 再測驗一次</button>
                <button class="btn-main" onclick="window.location.href='{{ "/" | relative_url }}'" style="margin: 0; background: #95a5a6;">⌂ 返回文法複習主頁面</button>
            </div>
        </div>
    </div>
</div>

<script>
    const questionsData = [
        {
            q: "______ through the crowded night market, we discovered several traditional snacks recommended by local residents nearby.",
            opts: ["(A) Walked", "(B) Walking", "(C) To walk", "(D) Being walked"],
            ans: 1, 
            zh: "走過擁擠的夜市時，我們發現了幾個附近當地居民推薦的傳統小吃。"
        },
        {
            q: "______ after studying all night, the students struggled to remain awake during the morning history lecture.",
            opts: ["(A) Exhausting", "(B) Exhausts", "(C) Exhausted", "(D) To exhaust"],
            ans: 2, 
            zh: "熬夜讀書後感到筋疲力盡，學生們在早上的歷史課中努力保持清醒。"
        },
        {
            q: "______ for the speech competition, my classmate practiced pronunciation repeatedly in front of the mirror.",
            opts: ["(A) While prepared", "(B) While preparing", "(C) Prepared", "(D) During prepare"],
            ans: 1,
            zh: "在準備演講比賽的同時，我的同學在鏡子前反覆練習發音。"
        },
        {
            q: "______ during the basketball championship game, the team captain was immediately taken to a nearby hospital.",
            opts: ["(A) Injuring", "(B) Injured", "(C) To injure", "(D) Being injuring"],
            ans: 1,
            zh: "在籃球冠軍賽中受傷，這位隊長立刻被送往附近的醫院。"
        },
        {
            q: "______ the final examination successfully, many students celebrated happily at restaurants near the train station.",
            opts: ["(A) Have completed", "(B) Completed", "(C) Having completed", "(D) Having been completed"],
            ans: 2,
            zh: "順利完成期末考後，許多學生開心地在火車站附近的餐廳慶祝。"
        },
        {
            q: "______ for the subway, several commuters checked messages and replied quickly to important business emails.",
            opts: ["(A) When waited", "(B) When waiting", "(C) Waited", "(D) On wait"],
            ans: 1,
            zh: "等待地鐵時，幾位通勤者查看了訊息並快速回覆了重要的商業電子郵件。"
        },
        {
            q: "______ by the sudden earthquake, many office workers ran downstairs immediately after hearing the emergency alarm.",
            opts: ["(A) Shocking", "(B) Shocked", "(C) Shock", "(D) Being shocking"],
            ans: 1,
            zh: "被突如其來的地震嚇到，許多上班族在聽到緊急警報後立刻跑到樓下。"
        },
        {
            q: "______ the emotional graduation ceremony, several parents quietly wiped tears from their eyes during the speech.",
            opts: ["(A) Watched", "(B) Watching", "(C) To watching", "(D) Have watched"],
            ans: 1,
            zh: "看著感人的畢業典禮，幾位家長在演講過程中默默地擦去眼角的淚水。"
        },
        {
            q: "______ about the upcoming typhoon, local residents stayed calm and prepared emergency supplies carefully.",
            opts: ["(A) Although worrying", "(B) Although worried", "(C) Worrying", "(D) Despite worried"],
            ans: 1,
            zh: "雖然對即將到來的颱風感到擔憂，當地居民保持冷靜並仔細準備了應急物資。"
        },
        {
            q: "______ by supportive teammates, the nervous singer gradually became more confident during the school performance.",
            opts: ["(A) Surrounding", "(B) Surrounded", "(C) Surround", "(D) To surround"],
            ans: 1,
            zh: "被充滿支持的隊友們圍繞著，這位緊張的歌手在學校表演中逐漸變得更有自信。"
        },
        {
            q: "______ as class leader, Jason worked harder to earn his classmates’ trust this semester.",
            opts: ["(A) Having chosen", "(B) Choosing", "(C) Having been chosen", "(D) Choose"],
            ans: 2,
            zh: "被選為班長後，Jason這學期更努力學習以贏得同學的信任。"
        },
        {
            q: "______ about Taiwanese culture, the exchange students visited several traditional temples during their first weekend.",
            opts: ["(A) Curious", "(B) Curiously", "(C) Being curiosity", "(D) Curiosity"],
            ans: 0,
            zh: "對台灣文化感到好奇，交換學生們在他們的第一個週末參觀了幾座傳統寺廟。"
        },
        {
            q: "______ by her teacher’s advice, the shy student finally joined the English speech competition.",
            opts: ["(A) Encouraging", "(B) Encouraged", "(C) Encourage", "(D) To encouraging"],
            ans: 1,
            zh: "受到老師建議的鼓勵，這位害羞的學生終於參加了英語演講比賽。"
        },
        {
            q: "______ the group presentation, the students thanked one another warmly for their cooperation and effort.",
            opts: ["(A) After finished", "(B) After finishing", "(C) Finished", "(D) Finish"],
            ans: 1,
            zh: "完成團體報告後，學生們熱情地感謝彼此的合作與努力。"
        },
        {
            q: "______ near the concert stage, several excited fans recorded videos and sang loudly with their friends.",
            opts: ["(A) Stood", "(B) Standing", "(C) Stand", "(D) To standing"],
            ans: 1,
            zh: "站在演唱會舞台附近，幾位興奮的粉絲錄製影片並與朋友大聲唱歌。"
        },
        {
            q: "______ about the approaching typhoon, many residents bought emergency supplies before supermarkets became crowded.",
            opts: ["(A) Worrying", "(B) Worried", "(C) To worry", "(D) Being worrying"],
            ans: 1,
            zh: "擔心逼近的颱風，許多居民在超市變得擁擠前購買了應急物資。"
        },
        {
            q: "______ unfamiliar with the new software, several employees asked younger colleagues for help during training.",
            opts: ["(A) Been", "(B) Being", "(C) Unfamiliarized", "(D) Unfamiliarizing"],
            ans: 1,
            zh: "因為對新軟體不熟悉，幾位員工在培訓期間向年輕同事尋求幫助。"
        },
        {
            q: "______ by the environmental documentary, many teenagers began joining weekend beach-cleaning activities in their community.",
            opts: ["(A) Inspiring", "(B) Inspired", "(C) Inspire", "(D) Being inspiring"],
            ans: 1,
            zh: "受到環保紀錄片的啟發，許多青少年開始參加社區的週末淨灘活動。"
        },
        {
            q: "______ about online scams, my grandmother became more careful when receiving strange messages.",
            opts: ["(A) Having warned", "(B) Warning", "(C) Having been warned", "(D) To warn"],
            ans: 2,
            zh: "被警告過網路詐騙後，我祖母在收到奇怪訊息時變得更加小心。"
        },
        {
            q: "______ after the long school trip, the students fell asleep quickly on the bus ride home.",
            opts: ["(A) Tiring", "(B) Tired", "(C) To tire", "(D) Being tiring"],
            ans: 1,
            zh: "漫長的校外教學後感到疲累，學生們在回程的公車上很快就睡著了。"
        }
    ];

    // Fisher-Yates 洗牌演算法，用於打亂題目陣列順序
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffleArray(questionsData);

    let curIdx = 0;
    let userAnswers = new Array(questionsData.length).fill(null);

    function render() {
        const item = questionsData[curIdx];
        document.getElementById('progress-label').innerText = `${curIdx + 1} / ${questionsData.length}`;
        document.getElementById('main-card-inner').classList.remove('is-flipped');
        
        const displayQ = item.q.replace(/_+/g, '<span class="blank-text"> </span>');
        document.getElementById('quiz-stem').innerHTML = displayQ;
        document.getElementById('back-zh').innerText = item.zh;
        
        const optionsArea = document.getElementById('quiz-options');
        optionsArea.innerHTML = '';
        item.opts.forEach((optStr, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn' + (userAnswers[curIdx] === optIdx ? ' selected' : '');
            btn.innerText = optStr;
            btn.onclick = () => selectOption(optIdx);
            optionsArea.appendChild(btn);
        });

        document.getElementById('btn-prev').disabled = (curIdx === 0);
        
        if (curIdx === questionsData.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
        } else {
            document.getElementById('btn-next').style.display = 'block';
            document.getElementById('btn-submit').style.display = 'none';
        }
    }

    function selectOption(optIdx) {
        userAnswers[curIdx] = optIdx;
        render();
    }

    function flipCard() {
        document.getElementById('main-card-inner').classList.toggle('is-flipped');
    }

    function moveStep(n) {
        let next = curIdx + n;
        if (next >= 0 && next < questionsData.length) {
            curIdx = next;
            render();
        }
    }

    function submitQuiz() {
        let unanswered = userAnswers.filter(ans => ans === null).length;
        if (unanswered > 0) {
            let confirmSubmit = confirm(`你還有 ${unanswered} 題未作答，確定要送出嗎？`);
            if (!confirmSubmit) return;
        }

        let correctCount = 0;
        let reportHTML = '';

        questionsData.forEach((item, index) => {
            let userAnsIdx = userAnswers[index];
            let isCorrect = (userAnsIdx === item.ans);
            if (isCorrect) correctCount++;

            let userAnsStr = userAnsIdx !== null ? item.opts[userAnsIdx] : "（未作答）";
            let correctAnsStr = item.opts[item.ans];
            
            let reviewSent = item.q.replace(/_+/g, `<span class="${isCorrect ? 'text-green' : 'text-red'}"> [ ${userAnsStr} ] </span>`);

            reportHTML += `
                <div class="result-item">
                    <div class="review-sent"><b>Q${index + 1}:</b> ${reviewSent}</div>
                    <div style="font-size:0.95rem; color:#7f8c8d; margin-bottom:10px;">${item.zh}</div>
                    <div>你的作答：<span class="${isCorrect ? 'text-green' : 'text-red'}">${userAnsStr}</span> ${isCorrect ? '✅' : '❌'}</div>
                    ${!isCorrect ? `<div>正確答案：<span class="text-green">${correctAnsStr}</span></div>` : ''}
                </div>
            `;
        });

        const rate = Math.round((correctCount / questionsData.length) * 100);
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = `${rate} 分`;
        document.getElementById('final-stats').innerText = `答對題數：${correctCount} / ${questionsData.length}`;
        document.getElementById('report-list-view').innerHTML = reportHTML;
    }

    window.onload = () => { render(); };
</script>
</body>
</html>
